# Termux: pantalla completa y botones Herdr (prefijo Ctrl+Espacio).
# Aplicar con termux-reload-settings.
fullscreen = true
extra-keys-style = default
extra-keys-text-all-caps = false
extra-keys = [ \
  [ \
    {"key":"ESC","popup":{"macro":"CTRL SPACE ?","display":"Ayuda"}}, \
    {"key":"TAB","popup":{"macro":"CTRL SPACE b","display":"Barra"}}, \
    {"key":"CTRL","popup":"ALT"}, \
    {"key":"LEFT","popup":{"macro":"CTRL SPACE h","display":"Panel <"}}, \
    {"key":"DOWN","popup":{"macro":"CTRL SPACE j","display":"Panel v"}}, \
    {"key":"UP","popup":{"macro":"CTRL SPACE k","display":"Panel ^"}}, \
    {"key":"RIGHT","popup":{"macro":"CTRL SPACE l","display":"Panel >"}} \
  ], \
  [ \
    {"macro":"CTRL SPACE c","display":"Tab+","popup":{"macro":"CTRL SPACE N","display":"Work+"}}, \
    {"macro":"CTRL SPACE p","display":"Ant","popup":"PGUP"}, \
    {"macro":"CTRL SPACE n","display":"Sig","popup":"PGDN"}, \
    {"macro":"CTRL SPACE v","display":"Div","popup":{"macro":"CTRL SPACE -","display":"Div abajo"}}, \
    {"macro":"CTRL SPACE w","display":"Work","popup":{"macro":"CTRL SPACE g","display":"Ir a"}}, \
    {"macro":"CTRL SPACE z","display":"Zoom","popup":{"macro":"CTRL SPACE [","display":"Copiar"}}, \
    {"macro":"CTRL SPACE","display":"Herdr","popup":{"macro":"CTRL SPACE q","display":"Salir"}} \
  ] \
]
